# Git 镜像加速节点的 Docker Compose 部署定义。
# 只使用一个 Docker 命名卷保存全部运行数据，不挂载任何宿主机路径，也不在本地构建镜像。
services:
  git-daemon:
    # 镜像标签必须显式提供，缺少 IMAGE_TAG 时拒绝渲染配置，避免静默使用浮动标签。
    image: ghcr.io/neanc/git-daemon:${IMAGE_TAG:?必须显式设置 IMAGE_TAG}
    user: "10001:10001"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - target: 9418
        published: "${PUBLISHED_PORT:-9418}"
        protocol: tcp
    # 列表形式只透传宿主机同名变量；未设置时不注入，容器内该变量不存在，
    # 从而让“显式环境变量 → 卷内配置 → 默认值”的中间层（卷内配置）可达。
    # 取值校验与默认值由交付脚本 scripts/lib/foundation.sh 的 gm_load_config 提供。
    environment:
      - TZ                    # 默认 Asia/Shanghai
      - GIT_PORT              # 默认 9418
      - LISTEN_ADDRESS        # 默认 0.0.0.0
      - REPOS                 # 必填：分号分隔 owner/repo 或 owner/repo branch1,branch2；缺失时由程序启动校验拒绝
      - SHORT_LINKS           # 可选：分号分隔 owner/repo 与短链接名
      - ENABLE_CRON           # 默认 yes
      - CRON_SCHEDULE         # 默认 0 * * * *
      - ENABLE_HOSTS_UPDATE   # 默认 yes
      - HOSTS_CRON            # 默认 0 3 * * *
      - HOSTS_URL             # 默认 https://cdn.jsdelivr.net/gh/521xueweihan/GitHub520@main/hosts
      - HOSTS_URL_FALLBACK    # 默认 https://raw.hellogithub.com/hosts
      - PROXY_URL             # 可选：HTTPS 上游代理
      - GITHUB_TOKEN          # 可选：Token 二选一，建议改用命名卷内凭据文件
      - GITHUB_TOKEN_FILE     # 可选：建议使用命名卷内凭据文件而非 Token 变量
    volumes:
      - type: volume
        source: git-daemon-data
        target: /var/lib/git-daemon

volumes:
  git-daemon-data:
    name: git-daemon-data
